<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subscribe — Q's TB Tools</title>
<meta name="description" content="Subscribe to TB Auto-Crypt." />
<link rel="icon" href="tools-logo.png" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #05060a;
    --panel: #0c1020;
    --panel-line: #1c2440;
    --gold: #d4af37;
    --gold-bright: #f2d68f;
    --gold-dim: #8a742f;
    --emerald: #3d6b42;
    --emerald-bright: #6fa373;
    --danger: #c25b5b;
    --danger-bright: #e08585;
    --ink: #e9e6da;
    --ink-dim: #a8a692;
    --display: 'Cinzel', serif;
    --body: 'Spectral', serif;
    --utility: 'Oswald', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.6;
    overflow-x: hidden;
  }
  a { color: inherit; }
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(212,175,55,0.3), transparent),
      radial-gradient(1.5px 1.5px at 78% 15%, rgba(63,111,214,0.3), transparent),
      radial-gradient(1px 1px at 55% 75%, rgba(111,163,115,0.28), transparent),
      radial-gradient(1px 1px at 90% 55%, rgba(212,175,55,0.2), transparent);
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }
  header {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px clamp(20px, 5vw, 56px);
    border-bottom: 1px solid rgba(212,175,55,0.15);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }
  .brand img {
    height: 34px;
    width: 34px;
    object-fit: contain;
    filter: drop-shadow(0 0 6px rgba(212,175,55,0.35));
  }
  .brand-word {
    font-family: var(--utility);
    letter-spacing: 0.14em;
    font-size: 0.8rem;
    color: var(--gold-bright);
  }
  header nav a {
    font-family: var(--utility);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink-dim);
    border-bottom: 1px solid transparent;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  header nav a:hover { color: var(--gold-bright); border-color: var(--gold); }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding: 70px 20px 120px;
  }
  .eyebrow {
    font-family: var(--utility);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--emerald-bright);
    margin: 0 0 14px;
    text-align: center;
  }
  .eyebrow::before, .eyebrow::after {
    content: '✦';
    color: var(--gold-dim);
    margin: 0 12px;
    font-size: 0.62rem;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(180deg, var(--panel) 0%, #080a15 100%);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    padding: 38px 36px;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 36px;
    width: 40px; height: 3px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  h1 {
    font-family: var(--display);
    font-size: 1.5rem;
    letter-spacing: 0.03em;
    color: var(--gold-bright);
    margin: 0 0 8px;
    text-align: center;
  }
  p.sub {
    color: var(--ink-dim);
    margin: 0 0 28px;
    font-size: 0.94rem;
    text-align: center;
    font-style: italic;
  }
  .step { display: none; }
  .step.active { display: block; }
  label {
    display: block;
    font-family: var(--utility);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 18px 0 8px;
    color: var(--ink-dim);
  }
  input[type="text"] {
    width: 100%;
    padding: 11px 14px;
    background: var(--void);
    border: 1px solid var(--panel-line);
    border-radius: 2px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 0.96rem;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--gold-dim);
  }
  .plan-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
  }
  .plan-group-label {
    font-family: var(--utility);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 6px 0 -2px;
    text-align: center;
  }
  .plan-option { position: relative; }
  .plan-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 1px; height: 1px;
  }
  .plan-option label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0;
    padding: 13px 16px;
    background: var(--void);
    border: 1px solid var(--panel-line);
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
    text-transform: none;
    letter-spacing: normal;
    font-family: var(--body);
  }
  .plan-option label:hover { border-color: var(--gold-dim); }
  .plan-option input[type="radio"]:checked + label {
    border-color: var(--gold);
    background: rgba(212,175,55,0.07);
  }
  .plan-name-row { display: flex; align-items: center; gap: 8px; }
  .plan-name { font-family: var(--utility); font-size: 0.9rem; letter-spacing: 0.03em; color: var(--ink); }
  .plan-badge {
    font-family: var(--utility);
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--void);
    background: var(--gold);
    padding: 2px 8px;
    border-radius: 2px;
  }
  .plan-billed { font-size: 0.78rem; color: var(--ink-dim); font-style: italic; margin-top: 2px; }
  .plan-price { font-family: var(--utility); font-size: 0.94rem; color: var(--gold-bright); white-space: nowrap; }
  .consent-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 16px;
  }
  .consent-row input[type="checkbox"] {
    flex-shrink: 0;
    margin-top: 3px;
    width: 15px;
    height: 15px;
    accent-color: var(--gold);
    cursor: pointer;
  }
  .consent-label {
    display: block;
    margin: 0;
    font-family: var(--body);
    font-size: 0.82rem;
    letter-spacing: normal;
    text-transform: none;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .consent-label a { color: var(--gold-bright); }
  button.cta-primary {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    font-family: var(--utility);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--void);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  button.cta-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(212,175,55,0.25);
  }
  button.cta-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .or-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 2px;
    font-family: var(--utility);
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--panel-line);
  }
  button.cta-secondary {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    font-family: var(--utility);
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--panel-line);
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.25s ease, color 0.25s ease;
  }
  button.cta-secondary:hover:not(:disabled) {
    border-color: var(--gold-dim);
    color: var(--gold-bright);
  }
  button.cta-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  #g_id_signin_container { display: flex; justify-content: center; margin: 6px 0 4px; }
  .signed-in-as {
    font-family: var(--utility);
    font-size: 0.76rem;
    letter-spacing: 0.06em;
    color: var(--emerald-bright);
    margin-top: 18px;
    text-align: center;
  }
  .error {
    color: var(--danger-bright);
    font-size: 0.84rem;
    margin-top: 14px;
    text-align: center;
    display: none;
  }
  .footer-note {
    color: var(--ink-dim);
    font-size: 0.8rem;
    margin-top: 26px;
    text-align: center;
    font-style: italic;
  }
  .footer-note a { color: var(--gold-bright); font-style: normal; }
  footer {
    position: relative;
    z-index: 1;
    border-top: 1px solid rgba(212,175,55,0.15);
    padding: 36px 20px 46px;
    text-align: center;
  }
  footer img {
    height: 40px;
    width: 40px;
    object-fit: contain;
    opacity: 0.85;
    margin-bottom: 10px;
  }
  footer .foot-word {
    font-family: var(--utility);
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  footer .foot-links {
    margin: 10px 0 0;
    font-family: var(--utility);
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  footer .foot-links a {
    color: var(--ink-dim);
    text-decoration: none;
  }
  footer .foot-links a:hover { color: var(--gold-bright); }
  :focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
</style>
</head>
<body>
<div class="stars"></div>
<header>
  <a class="brand" href="index.html">
    <img src="tools-logo.png" alt="Q's TB Tools" />
    <span class="brand-word">Q's TB Tools</span>
  </a>
  <nav>
    <a href="index.html">← Back to TB Tools</a>
  </nav>
</header>

<main>
  <div>
    <p class="eyebrow">Subscribe</p>
    <div class="card">
      <h1>TB Auto-Crypt</h1>
      <p class="sub">Sign in with Google, tell us who you are in-game, then head to checkout.</p>

      <!-- Step 1: Google sign-in -->
      <div class="step active" id="step-signin">
        <div id="g_id_signin_container"></div>
        <div class="error" id="signin-error"></div>
      </div>

      <!-- Step 2: tier + plan + registration form (name + TB username) -->
      <div class="step" id="step-register">
        <div class="signed-in-as" id="signed-in-as"></div>

        <label>Choose a tool package</label>
        <div class="plan-list" id="tier-list"></div>

        <label>Choose a plan</label>
        <div class="plan-list" id="plan-list"></div>

        <label for="display-name">Your name</label>
        <input type="text" id="display-name" placeholder="e.g. Alex" autocomplete="name" />

        <label for="tb-username">Main Total Battle username</label>
        <input type="text" id="tb-username" placeholder="Your in-game name" autocomplete="off" />

        <div class="consent-row">
          <input type="checkbox" id="agree-terms" />
          <label for="agree-terms" class="consent-label">
            I have read and agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a>, including the no-refunds policy.
          </label>
        </div>

        <div class="consent-row">
          <input type="checkbox" id="agree-withdrawal" />
          <label for="agree-withdrawal" class="consent-label">
            I understand access begins immediately and I waive my right to withdraw from this purchase (EU customers — see Terms §6).
          </label>
        </div>

        <div class="error" id="register-error"></div>

        <button class="cta-primary" id="continue-btn" disabled>Continue to checkout</button>
        <div class="or-divider">or</div>
        <button class="cta-secondary" id="continue-btn-paypal" disabled>Pay with PayPal</button>
      </div>

      <p class="footer-note">
        Already subscribed? <a href="devices.html">Manage your devices</a>
      </p>
    </div>
  </div>
</main>

<footer>
  <img src="tools-logo.png" alt="Total Battle Tools" />
  <p class="foot-word">Q's Total Battle Tools</p>
  <p class="foot-links"><a href="terms.html">Terms of Service</a></p>
</footer>

<script>
  // ── Fill in your Web application OAuth client ID (Google Cloud Console) ──
  const GOOGLE_CLIENT_ID_WEB = "47674606892-0m90hd0cd01kijo69ssuqtn1j3igp32i.apps.googleusercontent.com";
  const WORKER_BASE_URL = "https://auto-crypt.ccc-hq.com";

  // ── Tiers — key must match one of TIER_PLAN_PRICE_ENV_VARS in worker.js ──
  // Which tool(s) a subscription unlocks. Add a new tier here (and give it
  // its own PLANS_BY_TIER / TRIALS_BY_TIER entry below) any time a new
  // standalone tool or bundle ships.
  const TIERS = [
    { key: "all_in", label: "All-In", desc: "Everything: Auto-Crypt + Battle Calculator", badge: "Best value", checked: true },
    { key: "autocrypt", label: "Auto-Crypt", desc: "Just the crypt-running automation", badge: null, checked: false },
    { key: "battlecalc", label: "Battle Calculator", desc: "Just the troop stack calculator", badge: null, checked: false },
  ];

  // ── Plans — per tier, key must match one of TIER_PLAN_PRICE_ENV_VARS[tier]
  // in worker.js. This is the one place to edit when a price changes or a
  // new billing period is added (plus the matching secret in the
  // Cloudflare dashboard). price/billed are display text only -- the
  // actual amount charged always comes from the Stripe Price itself, this
  // just needs to describe it accurately so nobody's surprised at checkout.
  //{ key: "annual", label: "Yearly", price: "€79.99 / yr", billed: "Billed per year", badge: "Save 33% • Best value", checked: false },
  const PLANS_BY_TIER = {
    all_in: [
      { key: "monthly", label: "Monthly", price: "€9.99 / mo", billed: "Billed monthly", badge: null, checked: true },
      { key: "quarterly", label: "3 Months", price: "€24.99 / 3 mo", billed: "Billed every 3 months", badge: "Save 17%", checked: false },
      { key: "semiannual", label: "6 Months", price: "€44.99 / 6 mo", billed: "Billed every 6 months", badge: "Save 25%", checked: false },
    ],
    // TODO: real prices once Stripe Products/Prices exist for this tier
    // (STRIPE_PRICE_AUTOCRYPT_MONTHLY etc. on the Worker) -- placeholders below.
    autocrypt: [
      { key: "monthly", label: "Monthly", price: "€X.XX / mo", billed: "Billed monthly", badge: null, checked: true },
      { key: "quarterly", label: "3 Months", price: "€X.XX / 3 mo", billed: "Billed every 3 months", badge: null, checked: false },
      { key: "semiannual", label: "6 Months", price: "€X.XX / 6 mo", billed: "Billed every 6 months", badge: null, checked: false },
    ],
    // TODO: real prices once Stripe Products/Prices exist for this tier
    // (STRIPE_PRICE_BATTLECALC_MONTHLY etc. on the Worker) -- placeholders below.
    battlecalc: [
      { key: "monthly", label: "Monthly", price: "€X.XX / mo", billed: "Billed monthly", badge: null, checked: true },
      { key: "quarterly", label: "3 Months", price: "€X.XX / 3 mo", billed: "Billed every 3 months", badge: null, checked: false },
      { key: "semiannual", label: "6 Months", price: "€X.XX / 6 mo", billed: "Billed every 6 months", badge: null, checked: false },
    ],
  };

  // Trials are a ONE-TIME payment (no auto-renewal) -- matches
  // TRIAL_PLAN_DAYS in worker.js. Limited to one trial per account, ever,
  // across ALL tiers (buying an Auto-Crypt trial uses up your one trial
  // for Battle Calculator too); the Worker rejects a second attempt with
  // "trial_already_used" and that message is shown in the error box below
  // the picker. Only tiers with real trial Prices configured on the Worker
  // are listed here -- an empty array just means no trial group renders
  // for that tier (nothing to click that would 500 at checkout).
  const TRIALS_BY_TIER = {
    all_in: [
      { key: "trial_7", label: "7-Day Trial", price: "€2.99", billed: "One-time payment, no auto-renewal", badge: "Trial", checked: false },
      { key: "trial_14", label: "14-Day Trial", price: "€4.99", billed: "One-time payment, no auto-renewal", badge: "Trial", checked: false },
    ],
    autocrypt: [],
    battlecalc: [],
  };

  // Deep-linked from index.html's buttons, e.g.
  // subscribe.html?plan=trial_7 (tier omitted -> defaults to all_in, same
  // as the pre-tier behavior these existing links already rely on) or
  // subscribe.html?tier=battlecalc&plan=monthly.
  const params = new URLSearchParams(window.location.search);
  const preselectedTier = params.get("tier");
  const preselectedPlan = params.get("plan");
  if (preselectedTier && TIERS.some((t) => t.key === preselectedTier)) {
    TIERS.forEach((t) => { t.checked = t.key === preselectedTier; });
  }

  function renderPlanGroup(plans) {
    return plans.map((p) => `
      <div class="plan-option">
        <input type="radio" name="plan" id="plan-${p.key}" value="${p.key}" ${p.checked ? "checked" : ""} />
        <label for="plan-${p.key}">
          <span>
            <span class="plan-name-row">
              <span class="plan-name">${p.label}</span>
              ${p.badge ? `<span class="plan-badge">${p.badge}</span>` : ""}
            </span>
            <div class="plan-billed">${p.billed}</div>
          </span>
          <span class="plan-price">${p.price}</span>
        </label>
      </div>
    `).join("");
  }

  function renderTiers() {
    const container = document.getElementById("tier-list");
    container.innerHTML = TIERS.map((t) => `
      <div class="plan-option">
        <input type="radio" name="tier" id="tier-${t.key}" value="${t.key}" ${t.checked ? "checked" : ""} />
        <label for="tier-${t.key}">
          <span>
            <span class="plan-name-row">
              <span class="plan-name">${t.label}</span>
              ${t.badge ? `<span class="plan-badge">${t.badge}</span>` : ""}
            </span>
            <div class="plan-billed">${t.desc}</div>
          </span>
        </label>
      </div>
    `).join("");
    document.querySelectorAll('input[name="tier"]').forEach((el) => {
      el.addEventListener("change", renderPlans);
    });
  }

  function getSelectedTier() {
    const checked = document.querySelector('input[name="tier"]:checked');
    return checked ? checked.value : TIERS[0].key;
  }

  function renderPlans() {
    const tier = getSelectedTier();
    const plans = PLANS_BY_TIER[tier] || [];
    const trials = TRIALS_BY_TIER[tier] || [];

    // A deep link's plan preselection only applies to plans/trials that
    // actually belong to the (possibly also deep-linked) selected tier --
    // otherwise fall back to each list's own default `checked` entry.
    if (preselectedPlan) {
      const matches = [...plans, ...trials].some((p) => p.key === preselectedPlan);
      if (matches) {
        [...plans, ...trials].forEach((p) => { p.checked = p.key === preselectedPlan; });
      }
    }

    const container = document.getElementById("plan-list");
    container.innerHTML =
      renderPlanGroup(plans) +
      (trials.length
        ? `<p class="plan-group-label">Or try it first (one-time, no renewal)</p>` + renderPlanGroup(trials)
        : "");
  }

  function getSelectedPlan() {
    const checked = document.querySelector('input[name="plan"]:checked');
    if (checked) return checked.value;
    const tier = getSelectedTier();
    const fallback = (PLANS_BY_TIER[tier] || [])[0];
    return fallback ? fallback.key : "monthly";
  }

  let currentIdToken = null;
  let currentEmail = null;

  function showStep(id) {
    document.querySelectorAll(".step").forEach((el) => el.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function decodeJwtPayload(jwt) {
    const b64 = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  }

  function handleCredentialResponse(response) {
    currentIdToken = response.credential;
    const payload = decodeJwtPayload(currentIdToken);
    currentEmail = payload.email;

    document.getElementById("signed-in-as").textContent = `Signed in as ${currentEmail}`;
    showStep("step-register");
  }

  function updateContinueEnabled() {
    const agreedTerms = document.getElementById("agree-terms").checked;
    const agreedWithdrawal = document.getElementById("agree-withdrawal").checked;
    const ready = agreedTerms && agreedWithdrawal;
    document.getElementById("continue-btn").disabled = !ready;
    document.getElementById("continue-btn-paypal").disabled = !ready;
  }

  window.onload = function () {
    renderTiers();
    renderPlans();
    document.getElementById("agree-terms").addEventListener("change", updateContinueEnabled);
    document.getElementById("agree-withdrawal").addEventListener("change", updateContinueEnabled);
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID_WEB,
      callback: handleCredentialResponse,
    });
    google.accounts.id.renderButton(
      document.getElementById("g_id_signin_container"),
      { theme: "filled_black", size: "large", width: 300 }
    );
  };

  // Shared by both checkout buttons -- paymentMethod is omitted for the
  // regular Managed Payments flow (card/Link/Apple Pay/Google Pay/local
  // methods) or "paypal" for the separate PayPal path (see worker.js's
  // handleCreateCheckout -- payment_method: "paypal" skips managed_payments
  // entirely since PayPal isn't on Managed Payments' supported list).
  async function startCheckout(paymentMethod, btn, otherBtn, busyLabel, defaultLabel) {
    const errorEl = document.getElementById("register-error");
    errorEl.style.display = "none";

    const name = document.getElementById("display-name").value.trim();
    const tbUsername = document.getElementById("tb-username").value.trim();
    const agreedTerms = document.getElementById("agree-terms").checked;
    const agreedWithdrawal = document.getElementById("agree-withdrawal").checked;

    if (!name || !tbUsername) {
      errorEl.textContent = "Please fill in both your name and your Total Battle username.";
      errorEl.style.display = "block";
      return;
    }
    // Belt and suspenders -- the buttons are already disabled until both
    // boxes are checked, but don't rely on that alone.
    if (!agreedTerms || !agreedWithdrawal) {
      errorEl.textContent = "Please check both boxes to confirm you've read the Terms of Service.";
      errorEl.style.display = "block";
      return;
    }

    btn.disabled = true;
    otherBtn.disabled = true;
    btn.textContent = busyLabel;

    try {
      // 1. Save registration details (name + TB username) against this Google account.
      const registerRes = await fetch(`${WORKER_BASE_URL}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id_token: currentIdToken,
          name,
          tb_username: tbUsername,
          terms_accepted: agreedTerms,
          withdrawal_waived: agreedWithdrawal,
        }),
      });
      if (!registerRes.ok) {
        const body = await registerRes.json().catch(() => ({}));
        throw new Error(body.detail || body.error || `Registration failed (${registerRes.status})`);
      }

      // 2. Create a Stripe Checkout Session for the selected plan and redirect to it.
      const checkoutBody = { id_token: currentIdToken, tier: getSelectedTier(), plan: getSelectedPlan() };
      if (paymentMethod) checkoutBody.payment_method = paymentMethod;
      const checkoutRes = await fetch(`${WORKER_BASE_URL}/create-checkout`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(checkoutBody),
      });
      if (!checkoutRes.ok) {
        const body = await checkoutRes.json().catch(() => ({}));
        throw new Error(body.detail || body.error || `Checkout failed (${checkoutRes.status})`);
      }
      const { url } = await checkoutRes.json();
      window.location.href = url;
    } catch (err) {
      errorEl.textContent = err.message || "Something went wrong. Please try again.";
      errorEl.style.display = "block";
      btn.textContent = defaultLabel;
      updateContinueEnabled(); // re-enable both buttons per current checkbox state
    }
  }

  document.getElementById("continue-btn").addEventListener("click", () => {
    const btn = document.getElementById("continue-btn");
    const paypalBtn = document.getElementById("continue-btn-paypal");
    startCheckout(undefined, btn, paypalBtn, "Working...", "Continue to checkout");
  });

  document.getElementById("continue-btn-paypal").addEventListener("click", () => {
    const btn = document.getElementById("continue-btn-paypal");
    const primaryBtn = document.getElementById("continue-btn");
    startCheckout("paypal", btn, primaryBtn, "Working...", "Pay with PayPal");
  });
</script>

</body>
</html>
